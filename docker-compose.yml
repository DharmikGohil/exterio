# Runs the API with a persistent data volume. The frontend runs with `npm run dev` in exterio-frontend.
services:
  api:
    build: ./exterio-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./exterio-backend/.env
        required: false
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - api-data:/app/data

volumes:
  api-data:
