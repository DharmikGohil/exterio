[project]
name = "exterio-render"
version = "0.1.0"
description = "Exterio photoreal renderer: SDXL + Canny ControlNet img2img on Modal"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["modal>=1.6", "fastapi>=0.115", "pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
